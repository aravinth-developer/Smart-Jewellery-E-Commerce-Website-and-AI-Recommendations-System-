<!-- WhatsApp Chat Window -->
<div id="wa-chat-container" class="wa-chat-container">

    <!-- Header -->
    <div class="wa-header">
        <div class="wa-profile">
            <div class="wa-avatar">💎</div>
            <div>
                <div class="wa-name">Selvi AI Assistant</div>
                <div class="wa-status">online</div>
            </div>
        </div>
        <div class="wa-close" onclick="toggleChat()">✖</div>
    </div>

    <!-- Chat Body -->
    <div id="wa-chat-body" class="wa-chat-body"></div>

    <!-- Footer -->
    <div class="wa-footer">
        <input type="text" id="wa-input" placeholder="Type a message">
        <button onclick="sendMessage()">➤</button>
    </div>

</div>
