{% load static %}
<div id="carouselExampleIndicators" 
     class="carousel slide" 
     data-bs-ride="carousel" 
     data-bs-interval="3000">

  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="5"></button>
  </div>

  <div class="carousel-inner" style="top:16px;">
    <div class="carousel-item active">
      <img src="{% static 'images/11.png'%}" class="d-block w-100" alt="Slide 1">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/12.png'%}" class="d-block w-100" alt="Slide 2">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/13.png'%}" class="d-block w-100" alt="Slide 3">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/14.png'%}" class="d-block w-100" alt="Slide 4">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/15.png'%}" class="d-block w-100" alt="Slide 5">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/16.png'%}" class="d-block w-100" alt="Slide 6">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>

</div>
