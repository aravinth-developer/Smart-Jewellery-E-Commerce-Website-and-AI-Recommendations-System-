{% extends 'shop/layouts/base.html' %}
{% load static %}

{% block title %}
Login | sreeselvi
{% endblock title %}

{% block content %}

<div class="auth-wrapper">
<div class="auth-card">

<h3 class="text-center text-gold mb-4">Reset Password</h3>

<form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="btn auth-btn w-100 mt-3">
        Send Reset Link
    </button>
</form>

</div>
</div>

{% endblock content %}
